id = "lasso"
name = "Lasso"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Review pane: agent diffs, inline comments back to the agent, file viewer"
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "scripts/fetch-or-build.sh"]

[[startup]]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/lasso\" --open-pane"]

[[panes]]
id = "review"
title = "Lasso review"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/lasso\""]

[[actions]]
id = "open"
title = "Open Lasso review"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/lasso\" --open-pane"]
