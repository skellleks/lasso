id = "lasso"
name = "Lasso"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Review pane: agent diffs, inline comments back to the agent, file viewer"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

[[startup]]
command = ["./target/release/lasso", "--open-pane"]

[[panes]]
id = "review"
title = "Lasso review"
placement = "split"
command = ["./target/release/lasso"]

[[actions]]
id = "open"
title = "Open Lasso review"
contexts = ["workspace"]
command = ["./target/release/lasso", "--open-pane"]
